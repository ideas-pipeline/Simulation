<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكي فيزياء المنجنيق — عرض ثلاثي الأبعاد</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🏹%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=__BUILD__">
<style>
  html, body { height: 100%; overflow: hidden; }
  #scene3d { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; z-index: 10; }
  .hud-top {
    top: 10px; inset-inline-start: 12px;
    background: rgba(252,252,251,0.92); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; box-shadow: var(--shadow);
    max-width: min(420px, calc(100vw - 24px));
  }
  .hud-top h1 { margin: 0; font-size: 1.02rem; }
  .hud-top .muted { font-size: 0.75rem; }
  .hud-stats {
    top: 10px; inset-inline-end: 12px;
    background: rgba(252,252,251,0.92); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; box-shadow: var(--shadow);
    font-size: 0.82rem; min-width: 210px;
  }
  .hud-stats div { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
  .hud-stats b { direction: ltr; font-variant-numeric: tabular-nums; }
  .hud-bottom {
    bottom: 12px; inset-inline-start: 50%; transform: translateX(50%);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    background: rgba(252,252,251,0.92); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 12px; box-shadow: var(--shadow);
    max-width: calc(100vw - 20px);
  }
  .hud-panel {
    top: 86px; inset-inline-end: 12px; bottom: 76px;
    width: min(330px, calc(100vw - 24px));
    background: rgba(252,252,251,0.95); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px; box-shadow: var(--shadow);
    overflow-y: auto;
  }
  .hud-panel.hidden { display: none; }
  #warnings3d .warning-item, #warnings3d .error-item { font-size: 0.78rem; }
  .hidden-chips { display: none; }
</style>
</head>
<body>

<canvas id="scene3d"></canvas>

<div class="hud hud-top">
  <h1>🏹 محاكي المنجنيق — عرض ثلاثي الأبعاد</h1>
  <span class="muted">نفس محرك الفيزياء (RK4/لاغرانج) — اسحب للدوران، عجلة الفأرة للتقريب | <a href="index.html">⇦ العرض ثنائي الأبعاد والرسوم البيانية</a></span>
</div>

<div class="hud hud-stats" id="hud-stats">
  <div><span>الزمن</span><b id="h-time">0.000 s</b></div>
  <div><span>الطور</span><b id="h-phase">—</b></div>
  <div><span>سرعة التحرير</span><b id="h-vrel">—</b></div>
  <div><span>المدى</span><b id="h-range">—</b></div>
  <div><span>الكفاءة</span><b id="h-eff">—</b></div>
</div>

<div class="hud hud-panel" id="controls3d-wrap">
  <div class="toolbar-row chips" style="margin-bottom:8px">
    <label class="chip"><input type="checkbox" id="chk-drag"> مقاومة الهواء</label>
    <label class="chip"><input type="checkbox" id="chk-sling"> المقلاع</label>
    <label class="chip"><input type="checkbox" id="chk-swing"> ثقل متأرجح</label>
  </div>
  <div id="warnings3d" class="warnings" aria-live="polite"></div>
  <div id="control-groups"></div>
  <button id="btn-defaults" class="btn btn-outline btn-block" type="button">↺ إعادة القيم الافتراضية</button>
</div>

<div class="hud hud-bottom">
  <button id="btn-play" class="btn btn-primary" type="button">▶ تشغيل</button>
  <button id="btn-pause" class="btn" type="button" disabled>⏸ إيقاف</button>
  <button id="btn-restart" class="btn" type="button">⟳ إعادة</button>
  <div class="speed-group" role="group">
    <button class="btn btn-speed" data-speed="0.25" type="button">×¼</button>
    <button class="btn btn-speed active" data-speed="1" type="button">×1</button>
    <button class="btn btn-speed" data-speed="4" type="button">×4</button>
  </div>
  <label class="chip"><input type="checkbox" id="chk-follow" checked> تتبع المقذوف</label>
  <button id="btn-camera" class="btn" type="button">📷 إعادة الكاميرا</button>
  <button id="btn-panel" class="btn" type="button">⚙ الإعدادات</button>
</div>

<!-- عناصر تتطلبها وحدة التحكم المشتركة ولا تُستخدم في صفحة العرض الثلاثي -->
<div class="hidden-chips">
  <label><input type="checkbox" id="chk-trajectory" checked></label>
  <label><input type="checkbox" id="chk-forces"></label>
  <label><input type="checkbox" id="chk-validation"></label>
  <button id="lock-sling" type="button"></button>
  <button id="lock-swing" type="button"></button>
</div>

<script src="vendor/three.min.js?v=__BUILD__"></script>
<script src="vendor/OrbitControls.js?v=__BUILD__"></script>
<script src="js/physics/integrator.js?v=__BUILD__"></script>
<script src="js/physics/trebuchet.js?v=__BUILD__"></script>
<script src="js/physics/projectile.js?v=__BUILD__"></script>
<script src="js/physics/energy.js?v=__BUILD__"></script>
<script src="js/physics/validation.js?v=__BUILD__"></script>
<script src="js/physics/structure.js?v=__BUILD__"></script>
<script src="js/physics/wall.js?v=__BUILD__"></script>
<script src="js/simulation.js?v=__BUILD__"></script>
<script src="js/optimizer.js?v=__BUILD__"></script>
<script src="js/ui.js?v=__BUILD__"></script>
<script src="js/renderer3d.js?v=__BUILD__"></script>
<script src="js/main3d.js?v=__BUILD__"></script>
</body>
</html>
