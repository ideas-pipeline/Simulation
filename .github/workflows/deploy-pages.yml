# نشر محاكي فيزياء المنجنيق على GitHub Pages
# الموقع ثابت بالكامل (HTML/CSS/JS) ويُنشر بدفع محتوى المستودع إلى فرع
# gh-pages الذي يخدمه GitHub Pages (وضع «النشر من فرع»).
# لا يُستخدم وضع تفعيل Pages عبر API لأن توكن الـ Actions لا يملك صلاحيته.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # كسر الكاش: استبدال وسم النسخة بمعرّف الـ commit حتى لا يخلط
      # المتصفح بين index.html جديد وملفات JS/CSS قديمة مخزنة مؤقتًا
      - name: Stamp asset versions with commit SHA
        run: sed -i "s/__BUILD__/${GITHUB_SHA::12}/g" index.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: '.github'
          commit_message: 'Deploy site: ${{ github.event.head_commit.message }}'
